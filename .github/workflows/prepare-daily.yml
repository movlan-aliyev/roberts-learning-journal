name: Prepare Daily Lessons

on:
  schedule:
    # Run at 12:17 UTC (7:17 AM ET / 6:17 AM ET during DST)
    # Using off-peak minute to reduce scheduling contention
    - cron: '17 12 * * 1-6'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), defaults to today'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily preparation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTENT_PROVIDER_API_KEY: ${{ secrets.CONTENT_PROVIDER_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
          TZ: America/New_York
        run: npx tsx scripts/prepare-daily-lessons.ts
